
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program Menghitung Total Belanja</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #e3f0ff, #f8fbff);
    min-height: 100vh;
    padding: 30px 15px;
    color: #20375c;
}

.container {
    max-width: 650px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

.icon {
    font-size: 45px;
    margin-bottom: 10px;
}

header h1 {
    color: #17447e;
    font-size: 27px;
    margin-bottom: 8px;
}

header p {
    color: #71839d;
    font-size: 14px;
}

.card, .result {
    background: white;
    padding: 25px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(40,90,150,0.09);
}

.card h2, .result h2 {
    font-size: 18px;
    color: #245b9e;
    margin-bottom: 20px;
}

.item {
    background: #f5f9ff;
    border: 1px solid #e0ebf8;
    padding: 18px;
    border-radius: 13px;
    margin-bottom: 15px;
}

.item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.item-header strong {
    color: #245b9e;
}

.remove {
    background: #ffe8e8;
    color: #c43c3c;
    padding: 7px 12px;
    font-size: 12px;
}

.form-group {
    margin-bottom: 14px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 600;
    color: #536985;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d8e4f2;
    border-radius: 10px;
    outline: none;
    font-size: 14px;
    background: white;
}

input:focus {
    border-color: #4388d8;
    box-shadow: 0 0 0 3px #4388d81c;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.add {
    width: 100%;
    background: #e5f0ff;
    color: #245b9e;
    margin-top: 5px;
}

.calculate {
    flex: 1;
    background: #2869b5;
    color: white;
}

.reset {
    background: #e8f0fa;
    color: #315d91;
}

.result {
    display: none;
}

.result-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px dashed #dce6f2;
    font-size: 14px;
}

.total {
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    background: #eaf3ff;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    font-weight: bold;
    color: #17447e;
}

.total strong {
    font-size: 20px;
}

.message {
    color: #d34444;
    font-size: 13px;
    margin-top: 12px;
}

footer {
    text-align: center;
    color: #8a9bb0;
    font-size: 12px;
    margin-top: 30px;
    padding: 20px;
    line-height: 1.8;
}

footer strong {
    color: #245b9e;
    font-size: 14px;
}

@media (max-width: 480px) {
    header h1 {
        font-size: 23px;
    }

    .card, .result {
        padding: 20px;
    }

    .buttons {
        flex-direction: column;
    }

    .result-row {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="icon">🛒</div>
    <h1>Program Menghitung Total Belanja</h1>
    <p>Hitung total belanja dengan mudah dan praktis.</p>
</header>

<div class="card">
    <h2>🛍️ Daftar Barang Belanja</h2>

    <div id="daftarBarang"></div>

    <button class="add" onclick="tambahBarang()">
        + Tambah Barang
    </button>

    <div class="buttons">
        <button class="calculate" onclick="hitungTotal()">
            Hitung Total Belanja
        </button>

        <button class="reset" onclick="resetForm()">
            Reset
        </button>
    </div>

    <p class="message" id="pesan"></p>
</div>

<div class="result" id="hasil">
    <h2>📋 Hasil Perhitungan</h2>

    <div id="rincianHasil"></div>

    <div class="total">
        <span>Total Belanja</span>
        <strong id="total"></strong>
    </div>
</div>

<footer>
    Program Menghitung Total Belanja
    <br>
    Dibuat dengan HTML, CSS, dan JavaScript
    <br><br>
    <strong>© 2026 Aprilia Ramadhani</strong>
    <br>
    Nama Pembuat
</footer>

</div>

<script>

let nomorBarang = 0;

function tambahBarang() {
    nomorBarang++;

    let daftar = document.getElementById("daftarBarang");

    let item = document.createElement("div");
    item.className = "item";
    item.id = "barang" + nomorBarang;

    item.innerHTML = `
        <div class="item-header">
            <strong>Barang ${nomorBarang}</strong>
            <button class="remove" onclick="hapusBarang(${nomorBarang})">
                Hapus
            </button>
        </div>

        <div class="form-group">
            <label>Nama Barang</label>
            <input type="text" class="nama" placeholder="Masukkan nama barang">
        </div>

        <div class="form-group">
            <label>Harga Barang (Rp)</label>
            <input type="number" class="harga" min="0" placeholder="Masukkan harga">
        </div>

        <div class="form-group">
            <label>Jumlah Barang</label>
            <input type="number" class="jumlah" min="1" step="1" placeholder="Masukkan jumlah">
        </div>
    `;

    daftar.appendChild(item);

    document.getElementById("hasil").style.display = "none";
    document.getElementById("pesan").innerHTML = "";
}

function hapusBarang(id) {
    let barang = document.getElementById("barang" + id);

    if (barang) {
        barang.remove();
    }

    document.getElementById("hasil").style.display = "none";
}

function rupiah(angka) {
    return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
    }).format(angka);
}

function hitungTotal() {

    let nama = document.querySelectorAll(".nama");
    let harga = document.querySelectorAll(".harga");
    let jumlah = document.querySelectorAll(".jumlah");

    let pesan = document.getElementById("pesan");
    let hasil = document.getElementById("hasil");
    let rincian = document.getElementById("rincianHasil");

    pesan.innerHTML = "";
    hasil.style.display = "none";
    rincian.innerHTML = "";

    if (nama.length === 0) {
        pesan.innerHTML = "Silakan tambahkan barang terlebih dahulu!";
        return;
    }

    let total = 0;

    for (let i = 0; i < nama.length; i++) {

        let namaBarang = nama[i].value.trim();
        let hargaBarang = harga[i].value;
        let jumlahBarang = jumlah[i].value;

        if (
            namaBarang === "" ||
            hargaBarang === "" ||
            jumlahBarang === ""
        ) {
            pesan.innerHTML = "Mohon lengkapi semua data barang!";
            return;
        }

        hargaBarang = Number(hargaBarang);
        jumlahBarang = Number(jumlahBarang);

        if (
            !Number.isFinite(hargaBarang) ||
            hargaBarang < 0 ||
            !Number.isSafeInteger(jumlahBarang) ||
            jumlahBarang < 1
        ) {
            pesan.innerHTML = "Masukkan harga dan jumlah barang yang valid!";
            return;
        }

        let subtotal = hargaBarang * jumlahBarang;

        if (!Number.isSafeInteger(subtotal) ||
            !Number.isSafeInteger(total + subtotal)) {
            pesan.innerHTML = "Total belanja terlalu besar untuk dihitung!";
            return;
        }

        total += subtotal;

        let baris = document.createElement("div");
        baris.className = "result-row";

        let keterangan = document.createElement("span");
        keterangan.textContent =
            namaBarang + " (" + jumlahBarang + " x " +
            rupiah(hargaBarang) + ")";

        let nilai = document.createElement("strong");
        nilai.textContent = rupiah(subtotal);

        baris.appendChild(keterangan);
        baris.appendChild(nilai);

        rincian.appendChild(baris);
    }

    document.getElementById("total").textContent = rupiah(total);

    hasil.style.display = "block";
}

function resetForm() {

    document.getElementById("daftarBarang").innerHTML = "";
    document.getElementById("rincianHasil").innerHTML = "";
    document.getElementById("pesan").innerHTML = "";
    document.getElementById("hasil").style.display = "none";

    nomorBarang = 0;

    tambahBarang();
}

// Menampilkan satu barang pertama saat website dibuka
tambahBarang();

</script>

</body>
</html>
